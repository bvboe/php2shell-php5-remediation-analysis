; HHVM 3.30 server config, default (non-RepoAuthoritative) mode.
; This is the "just run it on HHVM" configuration: bytecode is compiled on
; demand, as PHP would interpret on demand.
pid = /var/run/hhvm/pid

hhvm.server.type = proxygen
hhvm.server.port = 80
hhvm.server.source_root = /var/www/html
hhvm.server.default_document = index.php
hhvm.server.utf8ize_replace = true

hhvm.log.level = Warning
hhvm.log.use_log_file = true
hhvm.log.file = /dev/stdout

; Mirror the PHP containers' posture so the runtimes are compared on execution
; model rather than on configuration differences.
hhvm.server.upload.enable_upload_progress = true
hhvm.server.upload.upload_max_file_size = 16
hhvm.php_file.extensions[] = php

hhvm.repo.central.path = /var/run/hhvm/hhvm.hhbc
hhvm.repo.authoritative = false
